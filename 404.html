<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在跳转 · AI 黄埔学院</title>
    <script>
      const base = "/aihuangpu-preview";
      const path = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length)
        : window.location.pathname;
      window.location.replace(`${base}/?route=${encodeURIComponent(path + window.location.search + window.location.hash)}`);
    </script>
  </head>
  <body>正在打开 AI 黄埔学院…</body>
</html>
